[package]
name = "wach"
version = "0.2.2"
description = "Several WhatsApp Web accounts side by side, each fully separate."
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "wach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# "unstable" = several webviews in one window (Window::add_child).
tauri = { version = "2.12.5", features = ["unstable", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Already in Tauri's tree; used for account ids.
getrandom = "0.3"
tauri-plugin-single-instance = "2"
# In-app updates from GitHub Releases, signature-checked.
tauri-plugin-updater = "2"
# Already in Tauri's tree; only for ResizeDirection, which Tauri does not re-export.
tauri-runtime = "2.12"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri/wry use, so the WebView2 types match.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }

# Option B: our copy of tauri-runtime-wry 2.12.4 with one small change — on
# Windows it passes `data_store_identifier` to wry as a WebView2 profile name
# (search "WACH patch"). Drop this once Tauri supports profiles itself.
[patch.crates-io]
tauri-runtime-wry = { path = "patches/tauri-runtime-wry" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
