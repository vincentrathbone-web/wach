[package]
name = "wach"
version = "0.1.0"
description = "Several WhatsApp Web accounts side by side, each fully separate."
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "wach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
